<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmailCraft</title><style>body{margin:0;background:#0b1020;color:#e7edf8;font:15px/1.5 system-ui;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:38px;margin:0}.muted{color:#91a0b9}.panel{background:#121a2d;border:1px solid #26334d;border-radius:14px;padding:16px;margin:14px 0}label{display:block;color:#91a0b9;margin:10px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;background:#080e1a;color:#e7edf8;border:1px solid #33415d;border-radius:8px;padding:10px}button{background:linear-gradient(110deg,#7c3aed,#0891b2);border:0;border-radius:8px;padding:10px 14px;color:white;cursor:pointer;margin:6px 4px 6px 0}pre{white-space:pre-wrap;background:#080e1a;padding:12px;border-radius:8px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.status{color:#67e8a5}</style><main><h1>EmailCraft</h1><p class="muted">Compose a responsive email layout and export standalone HTML.</p><div class="grid"><section class="panel"><label>Brand</label><input id="brand" value="Northstar Studio"><label>Headline</label><input id="title" value="A better way to get things done"><label>Message</label><textarea id="body">A short message with one clear idea. Keep it readable on every screen.</textarea><label>Button text</label><input id="btn" value="Explore now"><label>Button URL</label><input id="url" value="https://example.com"><label>Accent</label><input id="color" type="color" value="#635bff"><button id="download">Download HTML</button><button id="copy">Copy HTML</button><p id="msg" class="status"></p></section><section class="panel"><h2>Preview</h2><div id="preview" style="background:white;color:#182033;padding:16px;border-radius:10px"></div><h2>HTML source</h2><pre id="source"></pre></section></div></main><script>const $=id=>document.getElementById(id);const fields=['brand','title','body','btn','url','color'];const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');function render(){const v=id=>esc($(id).value);const h=`<!doctype html><html><body style="margin:0;background:#f2f4f8;font-family:Arial"><table role="presentation" width="100%" style="padding:30px 8px"><tr><td align="center"><table role="presentation" width="600" style="max-width:600px;background:white;padding:30px"><tr><td><b>${v('brand')}</b><h1>${v('title')}</h1><p style="line-height:1.6;color:#596579">${v('body')}</p><a href="${v('url')}" style="background:${v('color')};color:white;padding:12px 20px;text-decoration:none;border-radius:7px">${v('btn')}</a></td></tr></table></td></tr></table></body></html>`;$('source').textContent=h;$('preview').innerHTML=h}fields.forEach(id=>$(id).addEventListener('input',render));$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('source').textContent],{type:'text/html'}));a.download='email-template.html';a.click()};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('source').textContent);$('msg').textContent='Copied.'};render();</script></html>
